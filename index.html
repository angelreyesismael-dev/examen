<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeLorean | Luxury Motors</title>
    <style>
        /* --- PANTALLA DE BIENVENIDA --- */
        .intro-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; display: flex; justify-content: center;
            align-items: center; z-index: 2000;
            animation: fadeOut 0.8s forwards 1.8s;
        }
        .intro-overlay h1 { color: #00d9ff; font-size: 4rem; letter-spacing: 10px; text-transform: uppercase; text-shadow: 0 0 20px #00d9ff; }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }

        /* --- ESTILOS GENERALES --- */
        body { margin: 0; font-family: Arial, sans-serif; background-color: #000; color: white; overflow-x: hidden; scroll-behavior: smooth; }

        /* --- NAVBAR --- */
        .navbar {
            background: #000; position: fixed; width: 100%; top: 0; height: 50px;
            z-index: 1000; display: flex; align-items: center; border-bottom: 2px solid #00d9ff;
        }
        .navbar a { color: #00d9ff; padding: 14px 15px; text-decoration: none; font-weight: bold; text-transform: uppercase; font-size: 13px; }
        .navbar a:hover { background: #004a57; color: white; }

        .hamburger { display: none; color: #00d9ff; font-size: 25px; padding: 10px 20px; cursor: pointer; margin-left: auto; }

        /* MENU LATERAL */
        .menu-lateral {
            position: fixed; top: 0; right: -220px; width: 220px; height: 100%;
            background: #111; padding-top: 60px; transition: 0.3s; border-left: 2px solid #00d9ff; z-index: 999;
        }
        .menu-lateral a { display: block; color: #00d9ff; padding: 15px; text-decoration: none; border-bottom: 1px solid #222; }
        #toggle:checked ~ .menu-lateral { right: 0; }

        /* --- SECCIONES --- */
        section { padding: 60px 20px; border-bottom: 2px solid #00d9ff; }
        .header-logo { padding: 0; background: #000; text-align: center; margin-top: 50px; }
        .logo-full { width: 100%; max-height: 350px; object-fit: contain; filter: invert(1) brightness(1.5); display: block; }

        .seccion-modelos { text-align: center; padding: 80px 20px; }
        .btn-lujo {
            display: inline-block; padding: 15px 40px; border: 2px solid #00d9ff;
            color: #00d9ff; text-decoration: none; font-weight: bold; transition: 0.3s;
        }
        .btn-lujo:hover { background: #00d9ff; color: black; box-shadow: 0 0 20px #00d9ff; }

        /* --- SECCIÓN ESPECIAL --- */
        .caja-especial { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 40px; max-width: 1200px; margin: 0 auto; }
        .caja-especial img { width: 45%; min-width: 300px; border: 1px solid #333; }
        .info-especial { width: 45%; min-width: 300px; }
        .tabla-datos { width: 100%; border-collapse: collapse; }
        .tabla-datos td { padding: 12px 0; border-bottom: 1px solid #222; }
        .tabla-datos .label { color: #00d9ff; font-weight: bold; width: 120px; }

        /* --- FORMULARIO --- */
        .card-compra { background: #111; max-width: 600px; margin: 0 auto; padding: 40px; border: 1px solid #00d9ff; border-radius: 8px; }
        input, textarea { width: 100%; padding: 12px; margin: 5px 0 15px 0; background: #222; border: 1px solid #444; color: white; box-sizing: border-box; }
        .btn-enviar { width: 100%; padding: 18px; background: #00d9ff; color: black; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; }

        @media (max-width: 768px) {
            .navbar a { display: none; }
            .hamburger { display: block; }
        }
    </style>
</head>
<body>

    <div class="intro-overlay"><h1>DELOREAN</h1></div>

    <input type="checkbox" id="toggle" hidden>

    <nav class="navbar">
        <a href="#inicio">Principal</a>
        <a href="modelos.html">Modelos</a>
        <a href="#especial">Destacado</a>
        <a href="#compra">Compra</a>
        <label for="toggle" class="hamburger">☰</label>
    </nav>

    <div class="menu-lateral">
        <a href="#inicio">Principal</a>
        <a href="modelos.html">Modelos</a>
        <a href="#especial">Destacado</a>
        <a href="#compra">Compra</a>
    </div>

    <section id="inicio" class="header-logo">
        <img src="img/logo.jpg" alt="DeLorean Logo" class="logo-full">
    </section>

    <section id="modelos" class="seccion-modelos">
        <h2>ÚLTIMOS MODELOS</h2>
        <p>Potencia pura y elegancia sin límites.</p>
        <a href="modelos.html" class="btn-lujo">EXPLORAR CATÁLOGO COMPLETO</a>
    </section>

    <section id="especial">
        <div class="caja-especial">
            <img src="img/primero.jpg" alt="DMC-12">
            <div class="info-especial">
                <h3 style="color:#00d9ff; font-size: 2.5rem; margin-top:0;">LA PRIMERA CREACIÓN</h3>
                <table class="tabla-datos">
                    <tr><td class="label">MOTOR:</td><td>V6 2.85L High Perf</td></tr>
                    <tr><td class="label">VELOCIDAD:</td><td>200 KM/H</td></tr>
                    <tr><td class="label">AÑO:</td><td>1981 Edition</td></tr>
                    <tr><td class="label">ESTILO:</td><td>Coupé Inoxidable</td></tr>
                </table>
            </div> 
        </div>
    </section>

    <section id="compra">
        <div class="card-compra">
            <h2 style="color:#00d9ff; text-align:center; margin-top:0;">RESERVA TU VEHÍCULO</h2>
            <form action="https://formspree.io/f/mnjloone" method="POST">
                <input type="text" name="name" placeholder="Nombre Completo" required>
                <input type="email" name="email" placeholder="Correo Electrónico" required>
                <textarea name="message" placeholder="¿Qué modelo te interesa?" rows="4" required></textarea>
                <button type="submit" class="btn-enviar">Enviar Solicitud</button>
            </form>
        </div>
    </section>

</body>
</html>
